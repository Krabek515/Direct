<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Direct</title>
  <style>
    body {
      margin: 0;
      width: 220px;
      font: 13px/1.3 "Segoe UI", sans-serif;
      color: #1f2933;
      background: #fff;
    }
    .wrap { padding: 10px 10px 8px; }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .lang { display: flex; align-items: center; gap: 1px; flex: 0 0 auto; }
    .lang button {
      width: auto;
      padding: 0 2px;
      background: transparent;
      color: #9aa5b1;
      font-size: 11px;
      font-weight: 700;
    }
    .lang button.active { color: #1f2933; }
    .sep { color: #c5ced6; font-size: 11px; }
    #mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9aa5b1;
      flex: 0 0 auto;
    }
    #mark.direct {
      background: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.28);
    }
    #mark.vpn { background: #94a3b8; }
    #state.direct { color: #15803d; }
    #state.vpn { color: #64748b; }
    #host {
      margin: 0;
      min-width: 0;
      font-size: 12px;
      color: #52606d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #state { margin: 6px 0 8px; font-size: 14px; font-weight: 650; }
    button {
      width: 100%;
      border: 0;
      border-radius: 7px;
      padding: 7px 8px;
      font: inherit;
      cursor: pointer;
    }
    #flip { background: #1f2933; color: #fff; font-weight: 600; }
    #power {
      margin-top: 4px;
      background: transparent;
      color: #7b8794;
      padding: 5px 8px;
    }
    #power:hover { color: #1f2933; }
    #open { display: flex; gap: 4px; margin-top: 6px; }
    #link {
      flex: 1;
      min-width: 0;
      border: 1px solid #e4e7eb;
      border-radius: 7px;
      padding: 6px 8px;
      font: inherit;
      color: inherit;
    }
    #go {
      width: auto;
      background: #f0f4f8;
      color: #1f2933;
      padding: 6px 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="row">
        <span id="mark"></span>
        <p id="host"></p>
      </div>
      <div id="lang" class="lang">
        <button type="button" data-lang="en">EN</button>
        <span class="sep">/</span>
        <button type="button" data-lang="ru">RU</button>
      </div>
    </div>
    <p id="state"></p>
    <button id="flip" type="button"></button>
    <form id="open">
      <input id="link" type="text" placeholder="Ссылка" autocomplete="off" spellcheck="false">
      <button id="go" type="submit">Напрямую</button>
    </form>
    <button id="power" type="button"></button>
  </div>
  <script src="i18n.js"></script>
  <script src="suffixes.js"></script>
  <script src="pac.js"></script>
  <script src="popup.js"></script>
</body>
</html>
